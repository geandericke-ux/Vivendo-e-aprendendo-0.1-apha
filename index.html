<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vivendo e Aprendendo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: white;
    }

    header {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 20px;
      position: sticky;
      top: 0;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #d4af37;
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: white;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #d4af37;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      font-size: 55px;
      color: #d4af37;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .botao {
      display: inline-block;
      background: #d4af37;
      color: black;
      padding: 15px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .botao:hover {
      background: #f4d675;
    }

    .sobre {
      background: #121212;
      padding: 80px 20px;
      text-align: center;
    }

    .sobre h2 {
      color: #d4af37;
      font-size: 35px;
      margin-bottom: 20px;
    }

    .sobre p {
      max-width: 750px;
      margin: auto;
      color: #ccc;
      font-size: 18px;
      line-height: 1.7;
    }

    .cards {
      padding: 80px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .cards h2 {
      text-align: center;
      color: #d4af37;
      font-size: 35px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
    }

    .card h3 {
      color: #d4af37;
      margin-bottom: 15px;
      font-size: 22px;
    }

    .card p {
      color: #bbb;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #333;
      color: #888;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 40px;
      }

      nav {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 0 8px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <div class="logo">VA <span>| Vivendo e Aprendendo</span></div>

      <div>
        <a href="#inicio">Início</a>
        <a href="#sobre">Sobre</a>
        <a href="#conteudos">Conteúdos</a>
      </div>
    </nav>
  </header>

  <main>

    <section class="hero" id="inicio">
      <div class="hero-content">
        <h1>Vivendo e Aprendendo</h1>

        <p>
          Um espaço dedicado ao conhecimento, experiências e aprendizado.
          Porque cada dia vivido é uma nova oportunidade para aprender.
        </p>
